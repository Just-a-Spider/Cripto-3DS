[project]
name = "cripto-bot-engine"
version = "0.1.0"
description = "Binance Crypto Bot & Nintendo 3DS Real-Time Telemetry Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-binance>=1.0.19",
    "pydantic>=2.6.0",
    "cryptography>=42.0.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "aiosqlite>=0.20.0",
    "aiohttp>=3.9.0",
    "discord.py>=2.3.0",
    "google-genai>=0.1.1",
    "langchain>=1.4.0",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-anthropic>=1.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: Unit tests for pure calculations, algorithmic logic and isolated components",
    "integration: Integration tests across database, FastAPI routes, watchdogs, and network protocols",
]
filterwarnings = [
    "ignore::DeprecationWarning:binance.ws.*",
    "ignore::DeprecationWarning:websockets.legacy.*",
    "ignore::DeprecationWarning:fastapi.applications.*",
    "ignore::pytest.PytestUnhandledThreadExceptionWarning"
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined names, unused imports)
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade (modern python idioms)
    "PLW",  # pylint warnings (invalid env defaults, etc.)
]
ignore = [
    "E501",    # line too long
    "F401",    # allow selective re-exports in facade modules
    "E402",    # module level import not at top of file
    "UP035",   # allow typing.Dict/List annotations
    "PLW0603", # global statement used for circuit breakers and watchdogs
    "PLW2901", # loop variable overwriting
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811", "PLW1510"]

